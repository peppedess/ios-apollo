name: shim

# apollo (Xiaomi 10T Pro): build the shim boot images on a Linux runner (no Mac or local toolchain needed).
#   apollo-probe-safe     : -DSHIM_NO_UFS_WRITE -DSHIM_HOLDLOG, never writes storage, log on screen
#                           page by page (20 s each), then reset. THE FIRST TEST: raw kernel.
#   apollo-probe-safe-lz4 : same, LZ4 kernel (try if ABL refuses the raw one)
#   apollo-probe-safe-gz  : same, gzip kernel (second fallback)
#   apollo-probe          : normal probe (writes its log to the end of userdata: only once Android data is gone)
# The stock DTB comes from the latest LineageOS apollon boot.img (tools/apollo-dtb.sh) and is not kept.
on:
  workflow_dispatch:
  push:
    branches: [apollo]
    paths: [.github/workflows/shim.yml, "shim/**", tools/apollo-dtb.sh]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm lz4 cpio
          git clone -q --depth 1 https://github.com/LineageOS/android_system_tools_mkbootimg "$RUNNER_TEMP/mkbootimg"
          git clone -q --depth 1 https://github.com/LineageOS/android_external_avb "$RUNNER_TEMP/avb"
          echo "MKBOOTIMG=python3 $RUNNER_TEMP/mkbootimg/mkbootimg.py" >> "$GITHUB_ENV"
          echo "UNPACK=python3 $RUNNER_TEMP/mkbootimg/unpack_bootimg.py" >> "$GITHUB_ENV"
          echo "AVBTOOL=python3 $RUNNER_TEMP/avb/avbtool.py" >> "$GITHUB_ENV"

      - name: Stock DTB (LineageOS apollon)
        run: |
          bash tools/apollo-dtb.sh "$RUNNER_TEMP/apollo.dtb"
          echo "DTB=$RUNNER_TEMP/apollo.dtb" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p out
          SAFE="-DSHIM_NO_UFS_WRITE -DSHIM_HOLDLOG"
          SHIM_CFLAGS="$SAFE" SHIM_KERNEL=raw bash shim/build.sh "" "$PWD/out/apollo-probe-safe.img"
          SHIM_CFLAGS="$SAFE" SHIM_KERNEL=lz4 bash shim/build.sh "" "$PWD/out/apollo-probe-safe-lz4.img"
          SHIM_CFLAGS="$SAFE" SHIM_KERNEL=gz bash shim/build.sh "" "$PWD/out/apollo-probe-safe-gz.img"
          bash shim/build.sh "" "$PWD/out/apollo-probe.img"
          python3 "$RUNNER_TEMP/mkbootimg/unpack_bootimg.py" --boot_img out/apollo-probe-safe.img --out "$RUNNER_TEMP/u" | head -14
          python3 "$RUNNER_TEMP/avb/avbtool.py" info_image --image out/apollo-probe-safe.img | head -6
          (cd out && sha256sum *.img > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: apollo-shim
          path: out/
